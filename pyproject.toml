[project]
name = "manyminds"
version = "0.0.1"
description = "Pre-alpha placeholder: a local app that gathers cited evidence about claims found on the web. Not usable yet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew DeVerna" }]
keywords = ["fact-checking", "research", "evidence", "nicegui", "openrouter"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mr-devs/manyminds"
Issues = "https://github.com/mr-devs/manyminds/issues"

[project.scripts]
manyminds = "manyminds.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.7,<0.14"

[tool.pytest]
strict = true
addopts = ["-ra", "-p", "pytester"]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["live: calls the real OpenRouter API; opt in with -m live and a real key"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
